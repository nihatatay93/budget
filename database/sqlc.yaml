version: "2"
sql:
  - engine: "postgresql"
    schema: "../apps/server/internal/platform/postgres/migrations"
    queries: "queries"
    gen:
      go:
        package: "sqlc"
        out: "../apps/server/internal/platform/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
